
services:
  - type: web
    name: oss-uploader
    env: python
    plan: free
    buildCommand: ""
    startCommand: "python app.py"
    envVars:
      - key: ALIYUN_ACCESS_KEY_ID
        sync: false
      - key: ALIYUN_ACCESS_KEY_SECRET
        sync: false
      - key: ALIYUN_OSS_ENDPOINT
        sync: false
      - key: ALIYUN_BUCKET_NAME
        sync: false
